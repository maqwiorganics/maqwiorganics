name: Install theme foundation on temporary site
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/install-theme-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maqwi-temporary-theme-install
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate PHP syntax
        run: find wp-content/themes/maqwi-organics -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install new inactive child theme through FTPS
        env:
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os, io, hashlib, pathlib, re
          root = pathlib.Path('wp-content/themes/maqwi-organics')
          allowed = ['style.css','theme.json','functions.php','front-page.php','header-maqwi.php','footer-maqwi.php','patterns/home.php','assets/images/logo.webp','assets/images/honey.webp','assets/images/ghee.webp','assets/images/achaar.webp','assets/images/itar.webp']
          assert sorted(str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()) == sorted(allowed)
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25)
          ftp.connect('ftpupload.net',21)
          ftp.login('if0_43106867',os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          ftp.cwd('/htdocs/wp-content/themes')
          themes = set(ftp.nlst())
          assert 'kadence' in themes, 'Official Kadence parent must be installed first'
          assert 'maqwi-organics' not in themes, 'Existing theme found; refusing to overwrite'
          ftp.cwd('/htdocs/wp-content/updraft')
          names = [pathlib.PurePosixPath(n).name for n in ftp.nlst()]
          groups = {}
          for name in names:
              m = re.match(r'(backup_.*)-(?P<component>db|plugins|themes|uploads|others)(?:\d+)?\.(?:gz|zip)$',name)
              if m: groups.setdefault(m.group(1),set()).add(m.group('component'))
          assert any({'db','plugins','themes','uploads','others'} <= parts for parts in groups.values()), 'Full backup components required before install'
          target = '/htdocs/wp-content/themes/maqwi-organics'
          temporary = '/htdocs/wp-content/themes/.maqwi-install-' + os.environ['GITHUB_RUN_ID']
          ftp.mkd(temporary)
          for directory in ['assets','assets/images','patterns']: ftp.mkd(temporary+'/'+directory)
          for relative in allowed:
              data = (root/relative).read_bytes()
              remote = temporary+'/'+relative
              ftp.storbinary('STOR '+remote,io.BytesIO(data))
              received = io.BytesIO()
              ftp.retrbinary('RETR '+remote,received.write)
              if hashlib.sha256(data).digest() != hashlib.sha256(received.getvalue()).digest():
                  print({"file":relative,"sent_bytes":len(data),"received_bytes":len(received.getvalue()),"sent_signature":data[:16].hex(),"received_signature":received.getvalue()[:16].hex()})
                  raise RuntimeError("Transferred file mismatch; refusing to publish theme directory")
          ftp.rename(temporary,target)
          ftp.quit()
          print('Installed inactive maqwi-organics theme; every file verified; no existing files overwritten.')
          PY
