name: Install tested commerce source with orders closed
on:
  push:
    branches: [staging]
    paths: ['config/commerce-source-release.json']
permissions:
  contents: read
concurrency:
  group: maqwi-production-plugin-deploy
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.INFINITYFREE_FTP_HOST }}
      USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
      PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a successful native integration run for these exact sources
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,urllib.request
          release=json.load(open('config/commerce-source-release.json'))
          assert release['configuration_requested'] is False
          commit=release['tested_commit']
          assert re.fullmatch('[0-9a-f]{40}',commit)
          run=int(release['test_run'])
          url='https://api.github.com/repos/maqwiorganics/maqwiorganics/actions/runs/'+str(run)
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
          assert result['head_sha']==commit and result['conclusion']=='success'
          assert result['path']=='.github/workflows/commerce-integration.yml'
          subprocess.run(['git','diff','--exit-code',commit,'HEAD','--','wp-content/plugins/maqwi-store-core','tests','.github/scripts/deploy_owned_commerce.py','.github/workflows/commerce-integration.yml'],check=True)
          print('Exact native-tested source confirmed; no database configuration request is included.')
          PY
          find wp-content/plugins/maqwi-store-core -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 tests/business-deploy.py
      - name: Verify current live baseline and preserve originals without writes
        run: python3 .github/scripts/deploy_owned_commerce.py prepare
      - name: Retain originals before any remote source replacement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maqwi-commerce-source-originals-${{ github.run_id }}
          path: commerce-source-backup/
          retention-days: 30
          if-no-files-found: error
      - name: Install only owned PHP source; do not request database setup
        id: release
        run: python3 .github/scripts/deploy_owned_commerce.py apply
      - name: Install pinned public acceptance driver
        run: npm install --prefix .qa-deps --ignore-scripts --no-audit --no-fund --no-save playwright@1.62.1
      - name: Verify public storefront and closed-order guard
        env:
          NODE_PATH: ${{ github.workspace }}/.qa-deps/node_modules
        run: node tests/frontend/health.cjs
      - name: Restore prior source if post-install verification fails
        if: failure() && steps.release.outcome == 'success'
        run: python3 .github/scripts/deploy_owned_commerce.py rollback
      - name: Retain public acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maqwi-commerce-source-health-${{ github.run_id }}
          path: health-report/
          retention-days: 7
          if-no-files-found: warn
