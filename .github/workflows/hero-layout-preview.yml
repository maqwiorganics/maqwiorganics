name: Verify responsive hero preview
on:
  push:
    branches: [staging]
    paths:
      - 'wp-content/themes/maqwi-organics/style.css'
      - 'wp-content/themes/maqwi-organics/functions.php'
      - 'tests/frontend/hero-*'
      - '.github/workflows/hero-layout-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          php -l wp-content/themes/maqwi-organics/functions.php
          php tests/frontend/hero-preview.php > hero-preview.html
          npm install --prefix .qa-deps --ignore-scripts --no-audit --no-fund --no-save playwright@1.62.1
          python3 -m http.server 8765 > /tmp/hero-server.log 2>&1 &
      - run: node tests/frontend/hero-carousel.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/.qa-deps/node_modules
          HERO_BASE_URL: http://127.0.0.1:8765/hero-preview.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maqwi-mobile-hero-preview
          path: frontend-qa/
          retention-days: 7
