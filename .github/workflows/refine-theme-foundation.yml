name: Refine theme foundation on temporary site
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/refine-theme-foundation.yml']
permissions:
  contents: read
concurrency:
  group: maqwi-temporary-theme-install
  cancel-in-progress: false
jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source
        run: find wp-content/themes/maqwi-organics -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install self-hosted heading typography
        env:
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, ssl, os, io, hashlib, pathlib, subprocess
          local = pathlib.Path('wp-content/themes/maqwi-organics')
          allowed = ['assets/fonts/maqwi-garamond-latin.woff','assets/fonts/OFL.txt','theme.json','style.css']
          existing = ['theme.json','style.css']
          old_commit = 'a02a1d53384731e35546e1fe31ec5513ab3b3afc'
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=25)
          ftp.connect('ftpupload.net',21)
          ftp.login('if0_43106867',os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          root = '/htdocs/wp-content/themes/maqwi-organics'
          history = '/htdocs/wp-content/themes/.maqwi-refinement-' + os.environ['GITHUB_RUN_ID']
          originals = {}
          for name in existing:
              expected = subprocess.check_output(['git','show',old_commit+':'+str(local/name)])
              received = io.BytesIO()
              ftp.retrbinary('RETR '+root+'/'+name,received.write)
              assert hashlib.sha256(expected).digest() == hashlib.sha256(received.getvalue()).digest(), 'Unexpected existing source: '+name
              originals[name] = received.getvalue()
          ftp.mkd(history)
          assets = {pathlib.PurePosixPath(n).name for n in ftp.nlst(root+'/assets')}
          assert 'fonts' not in assets, 'Refusing to overwrite an existing fonts directory'
          ftp.mkd(root+'/assets/fonts')
          for name in existing: ftp.storbinary('STOR '+history+'/'+name,io.BytesIO(originals[name]))
          for name in allowed:
              data = (local/name).read_bytes()
              temporary = root+'/'+name+'.new-'+os.environ['GITHUB_RUN_ID']
              ftp.storbinary('STOR '+temporary,io.BytesIO(data))
              received = io.BytesIO()
              ftp.retrbinary('RETR '+temporary,received.write)
              assert hashlib.sha256(data).digest() == hashlib.sha256(received.getvalue()).digest(), name
              ftp.rename(temporary,root+'/'+name)
          ftp.quit()
          print('Self-hosted heading font installed; prior typography files retained; all source/font hashes verified.')
          PY
