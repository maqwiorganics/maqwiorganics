name: Verify approved commerce in isolated WordPress
on:
  push:
    branches: [staging]
    paths:
      - 'wp-content/plugins/maqwi-store-core/**'
      - 'tests/business-*'
      - '.github/workflows/commerce-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-commerce:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: maqwi_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate syntax
        run: find wp-content/plugins/maqwi-store-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install official isolated WordPress and WooCommerce matching live versions
        run: |
          curl --fail --silent --show-error --location https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar --output /tmp/wp.phar
          mkdir /tmp/maqwi-ci
          php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci core download --version=7.1.3
          php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci config create --dbname=maqwi_ci --dbuser=root --dbpass=ci-only --dbhost=127.0.0.1:3306 --skip-check
          php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci core install --url=http://maqwi-ci.invalid --title=Maqwi-CI --admin_user=ci-owner --admin_password=ci-only --admin_email=owner@example.invalid --skip-email
          php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci plugin install woocommerce --version=11.2.0 --activate
          mkdir -p /tmp/maqwi-ci/wp-content/plugins/maqwi-store-core
          cp -R wp-content/plugins/maqwi-store-core/. /tmp/maqwi-ci/wp-content/plugins/maqwi-store-core/
          php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci plugin activate maqwi-store-core
      - name: Native configuration, shipping, order guards and stock lifecycle checks
        env:
          MAQWI_RESERVATION_WORKER: ${{ github.workspace }}/tests/business-reservation-worker.php
          MAQWI_FIXTURE: ${{ github.workspace }}/tests/business-public-fixture.json
        run: php /tmp/wp.phar --allow-root --path=/tmp/maqwi-ci eval-file tests/business-setup-integration.php
