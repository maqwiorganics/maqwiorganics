name: InfinityFree read-only connection test

on:
  push:
    branches: [staging]
    paths: ['.github/workflows/infinityfree-readonly.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: infinityfree-readonly
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify encrypted FTP and list WordPress directories
        env:
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib
          import json
          import os
          import ssl
          import sys
          
          password = os.environ.get("FTP_PASSWORD", "")
          if not password:
              print("Connection test stopped: INFINITYFREE_FTP_PASSWORD is missing.")
              sys.exit(1)
          
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25)
          stage = "encrypted connection"
          try:
              ftp.connect("ftpupload.net", 21)
              ftp.auth()
              stage = "authentication"
              ftp.login("if0_43106867", password)
              ftp.prot_p()
              ftp.set_pasv(True)
              print("Encrypted FTP authentication succeeded.")
              stage = "WordPress directory verification"
              ftp.cwd("/htdocs")
              names = {name.rstrip("/").split("/")[-1] for name in ftp.nlst()}
              required = {"wp-admin", "wp-content", "wp-includes", "wp-config.php"}
              if not required.issubset(names):
                  print("Expected WordPress root was not verified; test stopped.")
                  sys.exit(1)
              print("WordPress root verified: /htdocs")
              for path in ("/htdocs/wp-content/themes", "/htdocs/wp-content/plugins"):
                  stage = "directory listing"
                  ftp.cwd(path)
                  names = sorted({name.rstrip("/").split("/")[-1] for name in ftp.nlst()})
                  print(json.dumps({"directory": path, "entries": names}, ensure_ascii=True))
              print("Read-only connection test completed. No website files changed.")
          except Exception as exc:
              print("Connection test failed at " + stage + " (" + type(exc).__name__ + ").")
              print("No unencrypted fallback was attempted. No website files changed.")
              sys.exit(1)
          finally:
              ftp.close()
          PY
